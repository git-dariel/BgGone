name: API
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './api[test]' pip-audit
      - run: python -m ruff check api
      - run: python -m pytest -q api/tests
      - run: python -m pip_audit
  images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image reference
        id: image
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/api-${{ matrix.variant }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.${{ matrix.variant }}
          push: false
          tags: ${{ steps.image.outputs.ref }}
          load: true
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Publish tagged image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker push "${{ steps.image.outputs.ref }}"
