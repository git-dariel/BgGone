[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bggone-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["Flask>=3.1,<4", "flask-cors>=5,<7", "Pillow>=11,<13", "python-dotenv>=1,<2", "redis>=5,<8", "rq>=2,<3", "prometheus-client>=0.21,<1", "gunicorn>=23,<26"]

[project.optional-dependencies]
cpu = ["rembg[cpu]>=2.0.75,<3", "onnxruntime>=1.23.2,<1.24"]
gpu = ["rembg[gpu]>=2.0.75,<3"]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "PyYAML>=6,<7", "openapi-spec-validator>=0.7,<1", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["removebg_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
